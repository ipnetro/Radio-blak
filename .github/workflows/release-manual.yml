name: Build Radio Ip-NeT signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # One-time migration: expand the latest source ZIP into normal repository files.
      # Existing .github workflows are deliberately preserved.
      - name: Migrate source ZIP to direct repository files
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/build.gradle.kts ] && [ -f app/src/main/AndroidManifest.xml ]; then
            echo "Proiect Android direct deja prezent; nu mai folosesc ZIP."
            exit 0
          fi

          ZIP="Radio-Ip-NeT-1.1.42-NOWPLAYING-FIX.zip"
          test -s "$ZIP"

          TEMP="$RUNNER_TEMP/radio-source"
          mkdir -p "$TEMP"
          unzip -q "$ZIP" -d "$TEMP"

          test -f "$TEMP/settings.gradle.kts"
          test -f "$TEMP/app/build.gradle.kts"
          test -f "$TEMP/app/src/main/AndroidManifest.xml"

          # Copy source and resources, but never replace the live GitHub workflows.
          rsync -a --exclude='.github/' "$TEMP/" ./

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/main.yml' ':!.github/workflows/release-manual.yml'
          if ! git diff --cached --quiet; then
            git commit -m "Migrate Android project from ZIP to direct source files [skip ci]"
            git push origin HEAD:main
          else
            echo "Nu există fișiere noi de migrat."
          fi

      - name: Check application ID
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          grep -n 'applicationId' app/build.gradle.kts
          grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"ro\.ipnet"' app/build.gradle.kts

      - name: Configure signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radio.jks"
          test -s "$RUNNER_TEMP/radio.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/radio.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew 2>/dev/null || true
          GRADLE="./gradlew"
          if [ ! -f ./gradlew ]; then GRADLE="gradle"; fi
          for attempt in 1 2 3 4 5; do
            echo "Build Release: încercarea $attempt din 5"
            if $GRADLE --no-daemon clean assembleRelease; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 15)); fi
          done
          echo "EROARE: Build Release a eșuat după 5 încercări."
          exit 1

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t APKS < <(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unsigned*')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "EROARE: Trebuie exact un APK Release. Găsite: ${#APKS[@]}"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "${APKS[0]}" release/Radio-Ip-NeT.apk
          test -s release/Radio-Ip-NeT.apk
          if command -v apksigner >/dev/null 2>&1; then apksigner verify --verbose release/Radio-Ip-NeT.apk; fi
          ls -lh release/Radio-Ip-NeT.apk
          sha256sum release/Radio-Ip-NeT.apk

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Ip-NeT-release
          path: release/Radio-Ip-NeT.apk
          if-no-files-found: error
          overwrite: true
