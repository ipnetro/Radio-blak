name: Build Radio Ip-NeT APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 1 -iname 'Radio-Ip-NeT-1.1.39-corectat.zip' | head -1)
          test -n "$ZIP" || { echo "Arhiva nu a fost gasita"; exit 1; }
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -1)
          test -n "$PROJECT" || { echo "Proiect Android negasit"; exit 1; }
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          sed -i -E "s/versionCode = [0-9]+/versionCode = $CODE/; s/versionName = \"[^\"]+\"/versionName = \"$VERSION\"/" "$PROJECT/app/build.gradle.kts"

      - name: Configure signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || exit 1
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radio.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/radio.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gradle -p "$PROJECT" clean assembleRelease
            mkdir -p release
            cp "$PROJECT/app/build/outputs/apk/release/app-release.apk" release/Radio-Ip-NeT.apk
          else
            gradle -p "$PROJECT" assembleDebug
          fi

      - name: Upload debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Ip-NeT-debug
          path: extracted/**/app/build/outputs/apk/debug/*.apk

      - name: Publish APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Radio Ip-NeT $GITHUB_REF_NAME" --notes "Radio Ip-NeT update"
          gh release upload "$GITHUB_REF_NAME" release/Radio-Ip-NeT.apk --clobber
