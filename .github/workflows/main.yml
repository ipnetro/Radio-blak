      - name: Extract project
        run: |
          echo "Arhive ZIP disponibile:"
          find . -maxdepth 2 -type f -iname "*.zip"

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "RadioIpNet*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "EROARE: Nu gasesc arhiva RadioIpNet."
            exit 1
          fi

          echo "Folosesc arhiva: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "EROARE: Nu gasesc proiectul Android."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
