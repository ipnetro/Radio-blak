
name: Build Radio Ip-NeT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "RadioIpNet*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Arhiva RadioIpNet nu a fost gasita!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Proiectul Android nu a fost gasit!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set application version
        run: |
          VERSION="1.1.${GITHUB_RUN_NUMBER}"
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $VERSION_CODE/" "$BUILD_FILE"
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]+\"/versionName = \"$VERSION\"/" "$BUILD_FILE"

          echo "Versiune noua: $VERSION"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Find and rename APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path "*/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK-ul nu a fost generat!"
            exit 1
          fi

          cp "$APK" Radio-Ip-NeT.apk
          echo "APK pregatit: Radio-Ip-NeT.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Ip-NeT-${{ env.APP_VERSION }}
          path: Radio-Ip-NeT.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Radio Ip-NeT v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Radio-Ip-NeT.apk
