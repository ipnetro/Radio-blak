
name: Build Radio Ip-NeT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "RadioIpNet*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Arhiva RadioIpNet nu a fost gasita!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Proiectul Android nu a fost gasit!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Find APK
        run: |
          APK=$(find extracted -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK-ul nu a fost generat!"
            exit 1
          fi

          cp "$APK" Radio-Ip-NeT.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Ip-NeT-APK
          path: Radio-Ip-NeT.apk

      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Radio Ip-NeT v1.1.${{ github.run_number }}
          generate_release_notes: true
          files: Radio-Ip-NeT.apk
