
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/radio-projects"
          mkdir -p "$ROOT"

          FOUND=""
          INDEX=0

          while IFS= read -r -d '' ZIP; do
            NAME="$(basename "$ZIP")"

            case "$NAME" in
              back*|BACK*)
                echo "Backup ignorat: $NAME"
                continue
                ;;
            esac

            INDEX=$((INDEX + 1))
            TEMP="$ROOT/project-$INDEX"
            mkdir -p "$TEMP"

            echo "Verific arhiva activa: $NAME"

            unzip -o -q "$ZIP" -d "$TEMP"

            while IFS= read -r SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              if { [ -f "$DIR/app/build.gradle.kts" ] ||
                   [ -f "$DIR/app/build.gradle" ]; } &&
                 [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then

                if [ -n "$FOUND" ]; then
                  echo "EROARE: Exista mai multe proiecte active."
                  exit 1
                fi

                FOUND="$DIR"
              fi
            done < <(
              find "$TEMP" -type f \
                \( -name settings.gradle.kts -o -name settings.gradle \)
            )
          done < <(
            find . -maxdepth 1 -type f -iname '*.zip' -print0
          )

          if [ -z "$FOUND" ]; then
            echo "EROARE: Nu am gasit proiectul Android."
            exit 1
          fi

          echo "Proiect selectat: $FOUND"
          echo "PROJECT=$FOUND" >> "$GITHUB_ENV"
