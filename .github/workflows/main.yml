
name: Build Radio Ip-NeT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Android project
        run: |
          echo "Arhive disponibile:"
          find . -maxdepth 2 -type f -iname "*.zip"

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "RadioIpNet*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "EROARE: Nu gasesc arhiva RadioIpNet."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "EROARE: Nu gasesc settings.gradle.kts."
            exit 1
          fi

          echo "Proiect gasit: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Ip-NeT-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
