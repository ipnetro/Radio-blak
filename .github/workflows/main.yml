name: Build Radio Ip-NeT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          grep -n 'applicationId' app/build.gradle.kts
          grep -Eq 'applicationId[[:space:]]*=[[:space:]]*"ro\.ipnet"' app/build.gradle.kts

          echo "Proiect Android detectat direct în rădăcina repository-ului."
          grep -n 'versionName\|versionCode' app/build.gradle.kts

      - name: Set version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag-ul trebuie să aibă formatul vMAJOR.MINOR.PATCH."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          sed -i -E "s/versionCode = [0-9]+/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          grep -n 'versionCode\|versionName' app/build.gradle.kts
          echo "Release: $VERSION (versionCode $VERSION_CODE)"

      - name: Configure release signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/radio-ipnet-release.jks"
          test -s "$RUNNER_TEMP/radio-ipnet-release.jks"

          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/radio-ipnet-release.jks"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gradle --no-daemon clean assembleRelease
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Collect debug APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t APKS < <(find app/build/outputs/apk/debug -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          cp "${APKS[0]}" output/Radio-Ip-NeT-debug.apk
          ls -lh output/Radio-Ip-NeT-debug.apk

      - name: Collect signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t APKS < <(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unsigned*')
          test "${#APKS[@]}" -eq 1
          cp "${APKS[0]}" output/Radio-Ip-NeT.apk
          ls -lh output/Radio-Ip-NeT.apk

      - name: Upload debug APK artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Ip-NeT-debug
          path: output/Radio-Ip-NeT-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s output/Radio-Ip-NeT.apk
          TAG="$GITHUB_REF_NAME"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/Radio-Ip-NeT.apk --clobber
          else
            gh release create "$TAG" output/Radio-Ip-NeT.apk \
              --title "Radio Ip-NeT $TAG" \
              --notes "APK oficial Radio Ip-NeT."
          fi
