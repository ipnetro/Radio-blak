name: Feature idea / Idee sau funcție nouă
description: Suggest an improvement / Propune o îmbunătățire
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Română:** Spune-ne ce ți-ar fi util. Nu include date de cont, parole sau chei API.
        **English:** Tell us what would be useful to you. Do not include account details, passwords, or API keys.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do? / Ce ai vrea să poți face?
      description: Explain the need or problem you have. / Explică nevoia sau problema pe care o întâmpini.
      placeholder: It would be useful if I could... / Mi-ar fi util să pot...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could this improvement work? / Cum ar funcționa îmbunătățirea?
      description: Describe an example use case. / Descrie un exemplu de utilizare.
    validations:
      required: false
  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you? / Cât de importantă este pentru tine?
      options:
        - Very important / Foarte importantă
        - Useful / Utilă
        - Just an idea / Doar o idee
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Phone and app version (optional) / Telefon și versiune aplicație (opțional)
      placeholder: For example / De exemplu: Android 15 / Radio Ip-NeT 1.1.46
    validations:
      required: false
