name: Bug / Problemă
description: Report a problem in the app / Raportează o problemă în aplicație
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Română:** Nu include parole, chei API, coduri de autentificare sau date private. Pentru probleme de securitate, urmează SECURITY.md și nu folosi acest formular public.
        **English:** Do not include passwords, API keys, authentication codes, or private data. For security issues, follow SECURITY.md and do not use this public form.
  - type: textarea
    id: summary
    attributes:
      label: What happened? / Ce s-a întâmplat?
      description: Describe the problem briefly. / Descrie pe scurt problema.
      placeholder: The app closes when... / Aplicația se închide când...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Pași pentru reproducere
      description: List the steps in order. / Scrie pașii în ordine.
      placeholder: "1. Open the app / Deschid aplicația…\n2. Tap… / Apăs…\n3. The problem appears / Apare problema…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen? / Ce te așteptai să se întâmple?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version / Versiunea aplicației
      placeholder: For example / De exemplu: 1.1.46
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version / Telefon și versiune Android
      placeholder: For example / De exemplu: Pixel 8 / Android 15
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Other details (no secrets) / Alte detalii (fără secrete)
      description: Remove usernames, private addresses, tokens, and keys from logs or screenshots. / Elimină nume de utilizator, adrese private, tokenuri și chei din jurnale sau capturi.
    validations:
      required: false
